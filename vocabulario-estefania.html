<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulario 1° Primaria — Colegio Estefanía</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }

  .header { background: linear-gradient(135deg, #16213e, #0f3460); padding: 20px; text-align: center; border-bottom: 2px solid #e94560; }
  .header h1 { font-size: 1.6em; color: #fff; font-weight: 700; letter-spacing: 1px; }
  .header p { color: #a8c8e8; font-size: 0.85em; margin-top: 4px; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px; background: #16213e; border-bottom: 1px solid #0f3460; align-items: center; }
  select { background: #0f3460; color: #eee; border: 1px solid #e94560; border-radius: 6px; padding: 6px 10px; font-size: 0.85em; cursor: pointer; }
  .mode-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .mode-btn { padding: 6px 14px; border-radius: 20px; border: 1.5px solid #e94560; background: transparent; color: #e94560; font-size: 0.8em; cursor: pointer; font-weight: 600; transition: all 0.2s; }
  .mode-btn.active, .mode-btn:hover { background: #e94560; color: #fff; }
  .stats { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 0.8em; color: #a8c8e8; }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat-num { font-size: 1.2em; font-weight: 700; color: #4ecca3; }

  /* FLASHCARD */
  .flashcard-area { display: flex; flex-direction: column; align-items: center; padding: 30px 16px; min-height: 70vh; }
  .card-counter { color: #a8c8e8; font-size: 0.85em; margin-bottom: 16px; }
  .card-wrap { perspective: 1000px; width: min(380px, 95vw); height: 240px; cursor: pointer; }
  .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s; border-radius: 16px; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .card-front { background: linear-gradient(135deg, #0f3460, #16213e); border: 2px solid #e94560; }
  .card-back { background: linear-gradient(135deg, #1a472a, #16213e); border: 2px solid #4ecca3; transform: rotateY(180deg); }
  .card-emoji { font-size: 3.5em; margin-bottom: 10px; }
  .card-word { font-size: 1.8em; font-weight: 700; color: #fff; letter-spacing: 1px; }
  .card-hint { font-size: 0.8em; color: #a8c8e8; margin-top: 8px; }
  .card-letters { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
  .card-letter { width: 32px; height: 36px; border-bottom: 2px solid #4ecca3; display: flex; align-items: flex-end; justify-content: center; font-size: 1.3em; font-weight: 700; color: #4ecca3; }
  .card-actions { display: flex; gap: 12px; margin-top: 20px; }
  .btn-action { padding: 10px 24px; border-radius: 24px; border: none; font-size: 0.9em; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-prev { background: #0f3460; color: #a8c8e8; border: 1px solid #a8c8e8; }
  .btn-next { background: #e94560; color: #fff; }
  .btn-flip { background: #4ecca3; color: #16213e; }
  .btn-action:hover { transform: scale(1.05); }
  .progress-bar { width: min(380px, 95vw); height: 6px; background: #0f3460; border-radius: 3px; margin-top: 14px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(to right, #e94560, #4ecca3); border-radius: 3px; transition: width 0.3s; }

  /* QUIZ */
  .quiz-area { padding: 20px 16px; max-width: 500px; margin: 0 auto; }
  .quiz-emoji { font-size: 5em; text-align: center; margin: 10px 0; }
  .quiz-q { font-size: 1.1em; text-align: center; color: #a8c8e8; margin-bottom: 16px; }
  .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quiz-opt { padding: 14px; background: #0f3460; border: 2px solid #1e5090; border-radius: 10px; color: #eee; font-size: 1em; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.2s; }
  .quiz-opt:hover { border-color: #e94560; background: #1a2a50; }
  .quiz-opt.correct { background: #1a472a; border-color: #4ecca3; color: #4ecca3; }
  .quiz-opt.wrong { background: #3d1212; border-color: #e94560; color: #e94560; }
  .quiz-opt.disabled { pointer-events: none; opacity: 0.6; }
  .quiz-score { text-align: center; margin-top: 12px; font-size: 0.9em; color: #a8c8e8; }
  .quiz-score span { color: #4ecca3; font-weight: 700; }
  .quiz-feedback { text-align: center; font-size: 1em; margin-top: 10px; min-height: 24px; font-weight: 600; }
  .btn-quiz-next { display: block; margin: 14px auto 0; padding: 10px 28px; background: #e94560; color: #fff; border: none; border-radius: 20px; font-size: 0.9em; font-weight: 700; cursor: pointer; }

  /* SPELL */
  .spell-area { padding: 20px 16px; max-width: 440px; margin: 0 auto; text-align: center; }
  .spell-emoji { font-size: 5em; }
  .spell-hint { font-size: 0.85em; color: #a8c8e8; margin: 8px 0; }
  .spell-boxes { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
  .spell-box { width: 40px; height: 46px; border-bottom: 3px solid #e94560; display: flex; align-items: flex-end; justify-content: center; font-size: 1.5em; font-weight: 700; color: #fff; transition: all 0.2s; }
  .spell-box.filled { border-color: #4ecca3; color: #4ecca3; }
  .spell-box.wrong-letter { border-color: #e94560; color: #e94560; }
  .spell-keyboard { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; max-width: 380px; margin-left: auto; margin-right: auto; }
  .key-btn { width: 38px; height: 38px; background: #0f3460; border: 1px solid #1e5090; border-radius: 6px; color: #eee; font-size: 0.95em; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .key-btn:hover { background: #e94560; border-color: #e94560; }
  .key-btn:disabled { opacity: 0.3; pointer-events: none; }
  .key-del { width: 54px; background: #3d1212; border-color: #e94560; color: #e94560; }
  .spell-result { font-size: 1em; font-weight: 700; margin-top: 10px; min-height: 24px; }
  .spell-result.ok { color: #4ecca3; }
  .spell-result.fail { color: #e94560; }
  .btn-spell-next { margin-top: 12px; padding: 10px 28px; background: #e94560; color: #fff; border: none; border-radius: 20px; font-size: 0.9em; font-weight: 700; cursor: pointer; }

  /* LIST */
  .list-area { padding: 14px 16px; }
  .week-section { margin-bottom: 20px; }
  .week-title { font-size: 1em; font-weight: 700; color: #e94560; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .word-card { background: #0f3460; border: 1px solid #1e5090; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .word-card:hover { border-color: #e94560; transform: translateY(-2px); }
  .word-card.learned { border-color: #4ecca3; background: #0a2a1a; }
  .word-emoji { font-size: 1.8em; display: block; }
  .word-text { font-size: 0.85em; font-weight: 600; margin-top: 4px; color: #eee; }
  .period-badge { font-size: 0.75em; background: #e94560; color: #fff; padding: 2px 8px; border-radius: 10px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <h1>📚 Vocabulario Colegio Estefanía</h1>
  <p>1° de Primaria — Compendio completo de todos los periodos</p>
</div>

<div class="controls">
  <select id="periodSelect">
    <option value="all">Todos los periodos</option>
    <option value="1">Primer Periodo</option>
    <option value="2">Segundo Periodo</option>
    <option value="3">Tercer Periodo</option>
    <option value="4">Cuarto Periodo</option>
    <option value="5">Quinto Periodo</option>
    <option value="6">Sexto Periodo</option>
    <option value="7">Séptimo Periodo</option>
  </select>
  <select id="weekSelect">
    <option value="all">Todas las semanas</option>
    <option value="1">Semana 1</option>
    <option value="2">Semana 2</option>
    <option value="3">Semana 3</option>
    <option value="4">Semana 4</option>
  </select>
  <div class="mode-btns">
    <button class="mode-btn active" onclick="setMode('flash')">🃏 Tarjetas</button>
    <button class="mode-btn" onclick="setMode('quiz')">🧠 Quiz</button>
    <button class="mode-btn" onclick="setMode('spell')">✏️ Deletrear</button>
    <button class="mode-btn" onclick="setMode('list')">📋 Lista</button>
  </div>
  <div class="stats">
    <div class="stat"><span class="stat-num" id="learnedCount">0</span><span>Aprendidas</span></div>
    <div class="stat"><span class="stat-num" id="totalCount">0</span><span>Total</span></div>
  </div>
</div>

<!-- FLASHCARD MODE -->
<div id="flashMode" class="flashcard-area">
  <div class="card-counter" id="flashCounter">Palabra 1 de 1</div>
  <div class="card-wrap" onclick="flipCard()">
    <div class="card" id="mainCard">
      <div class="card-face card-front">
        <div class="card-emoji" id="flashEmoji">🐻</div>
        <div class="card-word" id="flashWord">OSO</div>
        <div class="card-hint">Toca para ver la palabra completa</div>
      </div>
      <div class="card-face card-back">
        <div class="card-letters" id="flashLetters"></div>
        <div class="card-emoji" id="flashEmojiBack">🐻</div>
        <div class="card-word" id="flashWordBack">Oso</div>
        <div class="card-hint" id="flashPeriod">P1 - S1</div>
      </div>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="flashProgress"></div></div>
  <div class="card-actions">
    <button class="btn-action btn-prev" onclick="prevCard()">← Anterior</button>
    <button class="btn-action btn-flip" onclick="flipCard()">Voltear</button>
    <button class="btn-action btn-next" onclick="nextCard()">Siguiente →</button>
  </div>
  <div style="margin-top:14px;">
    <button class="btn-action" style="background:#1a472a;color:#4ecca3;border:1px solid #4ecca3;font-size:0.8em;" onclick="markLearned()">✔ Marcar aprendida</button>
    <button class="btn-action" style="background:#0f3460;color:#a8c8e8;border:1px solid #a8c8e8;font-size:0.8em;margin-left:8px;" onclick="shuffleCards()">🔀 Mezclar</button>
  </div>
</div>

<!-- QUIZ MODE -->
<div id="quizMode" class="quiz-area hidden">
  <div class="quiz-score">Aciertos: <span id="quizRight">0</span> / <span id="quizTotal">0</span></div>
  <div class="quiz-emoji" id="quizEmoji">🐻</div>
  <div class="quiz-q">¿Cómo se escribe esta palabra?</div>
  <div class="quiz-options" id="quizOptions"></div>
  <div class="quiz-feedback" id="quizFeedback"></div>
  <button class="btn-quiz-next" id="quizNextBtn" onclick="nextQuiz()" style="display:none;">Siguiente →</button>
</div>

<!-- SPELL MODE -->
<div id="spellMode" class="spell-area hidden">
  <div class="quiz-score">Aciertos: <span id="spellRight">0</span> / <span id="spellTotal">0</span></div>
  <div class="spell-emoji" id="spellEmoji">🐻</div>
  <div class="spell-hint">Escribe la palabra que corresponde a este emoji</div>
  <div class="spell-boxes" id="spellBoxes"></div>
  <div class="spell-keyboard" id="spellKeyboard"></div>
  <div class="spell-result" id="spellResult"></div>
  <button class="btn-spell-next" id="spellNextBtn" onclick="nextSpell()" style="display:none;">Siguiente →</button>
</div>

<!-- LIST MODE -->
<div id="listMode" class="list-area hidden"></div>

  {w:"Drama",e:"🎭",p:7,s:3},{w:"Drenaje",e:"🕳️",p:7,s:3},{w:"Comadre",e:"👩‍❤️‍👩",p:7,s:3},{w:"Madriguera",e:"🐇",p:7,s:3},{w:"Ladrar",e:"🐕",p:7,s:3},{w:"Globo",e:"🎈",p:7,s:3},{w:"Flauta",e:"🪈",p:7,s:3},{w:"Flaco",e:"🧍",p:7,s:3},{w:"Flecha",e:"🏹",p:7,s:3},{w:"Flan",e:"🍮",p:7,s:3},
  {w:"Grueso",e:"🪵",p:7,s:4},{w:"Grosero",e:"🙅",p:7,s:4},{w:"Grillo",e:"🦗",p:7,s:4},{w:"Grupo",e:"👥",p:7,s:4},{w:"Gracias",e:"🙏",p:7,s:4},{w:"Princesa",e:"👸",p:7,s:4},{w:"Precio",e:"🏷️",p:7,s:4},{w:"Propina",e:"🪙",p:7,s:4},{w:"Prisa",e:"🏃",p:7,s:4},{w:"Primavera",e:"🌸",p:7,s:4}

const pNames = ['','Primero','Segundo','Tercero','Cuarto','Quinto','Sexto','Séptimo'];
let filtered = [...VOCAB];
let flashIdx = 0, learned = new Set(), currentMode = 'flash';
let quizQueue = [], quizIdx = 0, quizRight = 0, quizTotalQ = 0;
let spellQueue = [], spellIdx = 0, spellRight = 0, spellTotalQ = 0, spellTyped = '', spellAnswer = '';

function getFiltered() {
  const p = document.getElementById('periodSelect').value;
  const s = document.getElementById('weekSelect').value;
  let arr = VOCAB;
  if(p !== 'all') arr = arr.filter(x => x.p === parseInt(p));
  if(s !== 'all') arr = arr.filter(x => x.s === parseInt(s));
  return arr;
}

document.getElementById('periodSelect').onchange = () => { filtered = getFiltered(); flashIdx=0; quizIdx=0; spellIdx=0; updateAll(); };
document.getElementById('weekSelect').onchange = () => { filtered = getFiltered(); flashIdx=0; quizIdx=0; spellIdx=0; updateAll(); };

function setMode(m) {
  currentMode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  ['flash','quiz','spell','list'].forEach((n,i) => { if(n===m) document.querySelectorAll('.mode-btn')[i].classList.add('active'); });
  document.getElementById('flashMode').classList.toggle('hidden', m!=='flash');
  document.getElementById('quizMode').classList.toggle('hidden', m!=='quiz');
  document.getElementById('spellMode').classList.toggle('hidden', m!=='spell');
  document.getElementById('listMode').classList.toggle('hidden', m!=='list');
  if(m==='quiz') initQuiz();
  if(m==='spell') initSpell();
  if(m==='list') renderList();
  if(m==='flash') renderFlash();
}

function updateAll() {
  document.getElementById('totalCount').textContent = filtered.length;
  document.getElementById('learnedCount').textContent = [...learned].filter(i => filtered.some((_,idx) => idx === i)).length;
  if(currentMode==='flash') renderFlash();
  if(currentMode==='quiz') initQuiz();
  if(currentMode==='spell') initSpell();
  if(currentMode==='list') renderList();
}

// FLASH
function renderFlash() {
  if(!filtered.length) return;
  const item = filtered[flashIdx];
  document.getElementById('mainCard').classList.remove('flipped');
  document.getElementById('flashEmoji').textContent = item.e;
  document.getElementById('flashEmojiBack').textContent = item.e;
  document.getElementById('flashWord').textContent = item.w.toUpperCase();
  document.getElementById('flashWordBack').textContent = item.w;
  document.getElementById('flashPeriod').textContent = `Periodo ${item.p} · Semana ${item.s}`;
  document.getElementById('flashCounter').textContent = `Palabra ${flashIdx+1} de ${filtered.length}`;
  document.getElementById('flashLetters').innerHTML = item.w.split('').map(l=>`<div class="card-letter">${l}</div>`).join('');
  document.getElementById('flashProgress').style.width = ((flashIdx+1)/filtered.length*100).toFixed(0)+'%';
}
function flipCard() { document.getElementById('mainCard').classList.toggle('flipped'); }
function nextCard() { if(filtered.length){ flashIdx=(flashIdx+1)%filtered.length; renderFlash(); } }
function prevCard() { if(filtered.length){ flashIdx=(flashIdx-1+filtered.length)%filtered.length; renderFlash(); } }
function markLearned() { learned.add(flashIdx); updateAll(); nextCard(); }
function shuffleCards() { filtered.sort(()=>Math.random()-0.5); flashIdx=0; renderFlash(); }

// QUIZ
function initQuiz() {
  quizQueue = [...filtered].sort(()=>Math.random()-0.5);
  quizIdx=0; quizRight=0; quizTotalQ=0;
  document.getElementById('quizRight').textContent=0;
  document.getElementById('quizTotal').textContent=0;
  document.getElementById('quizFeedback').textContent='';
  document.getElementById('quizNextBtn').style.display='none';
  renderQuiz();
}
function renderQuiz() {
  if(!quizQueue.length) return;
  const item = quizQueue[quizIdx % quizQueue.length];
  document.getElementById('quizEmoji').textContent = item.e;
  const opts = [item];
  while(opts.length < 4) {
    const r = VOCAB[Math.floor(Math.random()*VOCAB.length)];
    if(!opts.find(o=>o.w===r.w)) opts.push(r);
  }
  opts.sort(()=>Math.random()-0.5);
  document.getElementById('quizOptions').innerHTML = opts.map(o=>`<button class="quiz-opt" onclick="checkQuiz(this,'${o.w}','${item.w}')">${o.w}</button>`).join('');
  document.getElementById('quizFeedback').textContent='';
  document.getElementById('quizNextBtn').style.display='none';
}
function checkQuiz(btn, chosen, correct) {
  quizTotalQ++;
  document.querySelectorAll('.quiz-opt').forEach(b=>{ b.classList.add('disabled'); if(b.textContent===correct) b.classList.add('correct'); });
  if(chosen===correct){ quizRight++; document.getElementById('quizFeedback').textContent='✅ ¡Correcto!'; document.getElementById('quizFeedback').style.color='#4ecca3'; }
  else { btn.classList.add('wrong'); document.getElementById('quizFeedback').textContent='❌ Era: '+correct; document.getElementById('quizFeedback').style.color='#e94560'; }
  document.getElementById('quizRight').textContent=quizRight;
  document.getElementById('quizTotal').textContent=quizTotalQ;
  document.getElementById('quizNextBtn').style.display='block';
}
function nextQuiz() { quizIdx=(quizIdx+1)%quizQueue.length; renderQuiz(); }

// SPELL
const ALPHABET = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZÁÉÍÓÚÜ';
function initSpell() {
  spellQueue = [...filtered].sort(()=>Math.random()-0.5);
  spellIdx=0; spellRight=0; spellTotalQ=0; spellTyped='';
  document.getElementById('spellRight').textContent=0;
  document.getElementById('spellTotal').textContent=0;
  renderSpell();
}
function renderSpell() {
  if(!spellQueue.length) return;
  spellTyped='';
  const item = spellQueue[spellIdx % spellQueue.length];
  spellAnswer = item.w.toUpperCase().normalize('NFC');
  document.getElementById('spellEmoji').textContent = item.e;
  document.getElementById('spellResult').textContent='';
  document.getElementById('spellNextBtn').style.display='none';
  renderSpellBoxes();
  const needed = [...new Set(spellAnswer.split(''))].sort();
  const decoys = [];
  while(decoys.length < Math.min(8, 26-needed.length)) {
    const l = ALPHABET[Math.floor(Math.random()*ALPHABET.length)];
    if(!needed.includes(l) && !decoys.includes(l)) decoys.push(l);
  }
  const all = [...needed, ...decoys].sort(()=>Math.random()-0.5);
  document.getElementById('spellKeyboard').innerHTML = all.map(l=>`<button class="key-btn" onclick="spellType('${l}')">${l}</button>`).join('')+`<button class="key-btn key-del" onclick="spellDel()">⌫ Del</button>`;
}
function renderSpellBoxes() {
  document.getElementById('spellBoxes').innerHTML = spellAnswer.split('').map((l,i)=>{
    const t = spellTyped[i]||'';
    let cls='spell-box'; if(t) cls+=t===l?' filled':' wrong-letter';
    return `<div class="${cls}">${t}</div>`;
  }).join('');
}
function spellType(l) {
  if(spellTyped.length >= spellAnswer.length) return;
  spellTyped += l; renderSpellBoxes();
  if(spellTyped.length === spellAnswer.length) checkSpell();
}
function spellDel() { spellTyped=spellTyped.slice(0,-1); renderSpellBoxes(); }
function checkSpell() {
  spellTotalQ++;
  const ok = spellTyped === spellAnswer;
  if(ok){ spellRight++; document.getElementById('spellResult').textContent='✅ ¡Perfecto!'; document.getElementById('spellResult').className='spell-result ok'; }
  else { document.getElementById('spellResult').textContent='❌ Era: '+spellQueue[spellIdx%spellQueue.length].w; document.getElementById('spellResult').className='spell-result fail'; }
  document.getElementById('spellRight').textContent=spellRight;
  document.getElementById('spellTotal').textContent=spellTotalQ;
  document.getElementById('spellNextBtn').style.display='inline-block';
  document.querySelectorAll('.key-btn').forEach(b=>b.disabled=true);
}
function nextSpell() { spellIdx=(spellIdx+1)%spellQueue.length; renderSpell(); }

// LIST
function renderList() {
  const area = document.getElementById('listMode');
  const byGroup = {};
  filtered.forEach(item => {
    const key = `P${item.p}-S${item.s}`;
    if(!byGroup[key]) byGroup[key]={p:item.p,s:item.s,words:[]};
    byGroup[key].words.push(item);
  });
  area.innerHTML = Object.values(byGroup).map(({p,s,words})=>`
    <div class="week-section">
      <div class="week-title">
        <span class="period-badge">P${p}</span>
        ${pNames[p]} Periodo · Semana ${s}
        <small style="color:#a8c8e8;font-weight:400">(${words.length} palabras)</small>
      </div>
      <div class="word-grid">
        ${words.map(w=>`<div class="word-card"><span class="word-emoji">${w.e}</span><div class="word-text">${w.w}</div></div>`).join('')}
      </div>
    </div>`).join('');
}

// INIT
filtered = getFiltered();
document.getElementById('totalCount').textContent = filtered.length;
renderFlash();
</script>
